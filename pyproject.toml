# The externally maintained langchain-e2b integration still declares
# `deepagents<0.7.0`, but 0.7.0 keeps the sandbox API backward compatible. Its e2b
# dependency also caps wcmatch<11.0 while deepagents requires wcmatch>=11.0, so
# override both transitive bounds until langchain-e2b publishes compatible metadata.
tool.uv.override-dependencies = ["deepagents==0.7.19", "wcmatch>=11.0"]
[project]
name = "open-swe-agent"
version = "0.1.0"
description = "Open SWE Agent - Python agent for automating software engineering tasks"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "deepagents==0.7.19",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "httpx>=0.28.1",
    "PyJWT>=2.12.1",
    "cryptography>=50.0.0",
    "langgraph-sdk>=0.4.2",
    "langchain>=1.3.9",
    "langgraph>=1.2.10",
    "markdownify>=1.2.3",
    "langchain-anthropic>=1.5.4",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.10.16",
    "langchain-openai>=1.4.1",
    "langchain-fireworks>=1.5.2",
    "langchain-daytona>=0.0.8",
    "langchain-modal>=0.0.6",
    "langchain-runloop>=0.0.7",
    "langchain-e2b==0.0.6",
    "exa-py>=2.16.2",
    "langchain-google-genai>=4.3.2",
    "langchain-mcp-adapters>=0.3.1",
    "stagehand>=3.22.0",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "Pygments>=2.20.0",
]

[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

